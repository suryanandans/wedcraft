<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event RSVP - Test Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            padding: 32px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 300;
        }

        .event-info {
            background: #f8f9fb;
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        .event-info h2 {
            color: #1f2937;
            font-size: 18px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .info-item i {
            color: #4A90E2;
            width: 18px;
        }

        .form-section {
            padding: 32px 24px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:hover {
            border-color: #9ca3af;
        }

        .form-input:focus {
            outline: none;
            border-color: #4A90E2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .attendance-options {
            display: flex;
            gap: 12px;
        }

        .attendance-option {
            flex: 1;
            padding: 16px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            user-select: none;
        }

        .attendance-option:hover {
            border-color: #4A90E2;
            background: #f0f7ff;
        }

        .attendance-option.selected {
            border-color: #4A90E2;
            background: #4A90E2;
            color: white;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.25);
        }

        .attendance-option i {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
        }

        .food-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .food-option {
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            user-select: none;
        }

        .food-option:hover {
            border-color: #4A90E2;
            background: #f0f7ff;
        }

        .food-option.selected {
            border-color: #4A90E2;
            background: #4A90E2;
            color: white;
        }

        .food-option i {
            font-size: 18px;
            margin-bottom: 6px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(74, 144, 226, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
        }

        .loading i {
            font-size: 24px;
            color: #4A90E2;
            animation: spin 1s linear infinite;
        }

        .loading p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .guest-entry {
            background: #f8f9fb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .guest-entry-header {
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guest-entry-header i {
            color: #4A90E2;
        }

        .guest-food-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .guest-food-option {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            background: white;
            user-select: none;
        }

        .guest-food-option:hover {
            border-color: #4A90E2;
            background: #f0f7ff;
        }

        .guest-food-option.selected {
            border-color: #4A90E2;
            background: #4A90E2;
            color: white;
        }

        .guest-food-option i {
            display: block;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .child-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6b7280;
            cursor: pointer;
            user-select: none;
        }

        .child-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4A90E2;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 10px;
            }

            .header {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .form-section {
                padding: 24px 20px;
            }

            .attendance-options {
                flex-direction: column;
            }

            .guest-food-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Event RSVP</h1>
            <p>We would love to have you join us!</p>
        </div>

        <div class="event-info" id="eventInfo" style="display: none;">
            <h2>
                <i class="fas fa-calendar-alt"></i>
                <span id="eventName">Event Details</span>
            </h2>
            <div class="info-item">
                <i class="fas fa-clock"></i>
                <span id="eventDate">Date</span>
            </div>
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <span id="eventLocation">Location</span>
            </div>
        </div>

        <!-- Children Statistics Section -->
        <div class="event-info" id="childrenStats" style="display: none;">
            <h2>
                <i class="fas fa-child"></i>
                <span>Children Statistics</span>
            </h2>
            <div class="info-item">
                <i class="fas fa-users"></i>
                <span id="totalChildrenCount">Loading...</span>
            </div>
            <div class="info-item">
                <i class="fas fa-percentage"></i>
                <span id="childrenPercentage">Loading...</span>
            </div>
            <div class="info-item">
                <i class="fas fa-chart-bar"></i>
                <span id="attendanceBreakdown">Loading...</span>
            </div>
            <div class="info-item">
                <i class="fas fa-utensils"></i>
                <span id="foodPreferences">Loading...</span>
            </div>
            <button type="button" id="refreshStatsBtn" style="margin-top: 10px; padding: 8px 16px; background: #4A90E2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px;">
                <i class="fas fa-sync-alt"></i> Refresh Stats
            </button>
        </div>

        <div class="form-section">
            <div class="alert" id="alert"></div>

            <form id="rsvpForm">
                <input type="hidden" id="eventId" value="7" required>

                <div class="form-group">
                    <label class="form-label">Your Family Name *</label>
                    <input type="text" class="form-input" id="familyName" placeholder="Enter your family name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Will you be attending? *</label>
                    <div class="attendance-options">
                        <div class="attendance-option" data-value="Yes">
                            <i class="fas fa-check-circle"></i>
                            <div>Yes, I'll be there!</div>
                        </div>
                        <div class="attendance-option" data-value="Maybe">
                            <i class="fas fa-question-circle"></i>
                            <div>Not sure yet</div>
                        </div>
                    </div>
                </div>

                <div class="form-group" id="membersGroup" style="display: none;">
                    <label class="form-label">Number of Guests *</label>
                    <input type="number" class="form-input" id="membersCount" placeholder="How many people will attend?" min="1" max="20">
                </div>

                <div class="form-group" id="guestsDetailsGroup" style="display: none;">
                    <label class="form-label">Guest Details *</label>
                    <div id="guestsContainer"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">Submit RSVP</span>
                </button>

                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Submitting your response...</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedAttendance = null;
        let guestsData = [];

        // Load event data on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadEventData();
            setupFormHandlers();
            loadChildrenStatistics();
        });

        // Load event data - will be hard coded by user as needed
        function loadEventData() {
            // Try to get event ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event_id');
            if (eventId) {
                document.getElementById('eventId').value = eventId;
            }
            // Otherwise, uses the default hardcoded value in the HTML
        }

        // Setup form handlers
        function setupFormHandlers() {
            // Attendance selection
            document.querySelectorAll('.attendance-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.attendance-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedAttendance = this.dataset.value;
                    
                    // Show/hide additional fields based on attendance
                    const membersGroup = document.getElementById('membersGroup');
                    const guestsDetailsGroup = document.getElementById('guestsDetailsGroup');
                    
                    if (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') {
                        membersGroup.style.display = 'block';
                    } else {
                        membersGroup.style.display = 'none';
                        guestsDetailsGroup.style.display = 'none';
                        document.getElementById('membersCount').value = '';
                        guestsData = [];
                    }
                });
            });

            // Members count change handler
            document.getElementById('membersCount').addEventListener('change', function() {
                const count = parseInt(this.value);
                if (count > 0 && count <= 20) {
                    generateGuestFields(count);
                    document.getElementById('guestsDetailsGroup').style.display = 'block';
                } else {
                    document.getElementById('guestsDetailsGroup').style.display = 'none';
                }
            });

            // Form submission
            document.getElementById('rsvpForm').addEventListener('submit', handleSubmit);
            
            // Refresh stats button
            document.getElementById('refreshStatsBtn').addEventListener('click', function() {
                loadChildrenStatistics();
            });
        }

        // Load children statistics from API
        async function loadChildrenStatistics() {
            try {
                const eventId = document.getElementById('eventId').value;
                
                // Show loading state
                document.getElementById('totalChildrenCount').textContent = 'Loading...';
                document.getElementById('childrenPercentage').textContent = 'Loading...';
                document.getElementById('attendanceBreakdown').textContent = 'Loading...';
                document.getElementById('foodPreferences').textContent = 'Loading...';
                
                // Fetch children statistics for the specific event
                const response = await fetch(`/api/analytics/children-stats?event_id=${eventId}`);
                
                if (response.ok) {
                    const data = await response.json();
                    const childrenData = data.children_data;
                    
                    // Update total children count
                    document.getElementById('totalChildrenCount').textContent =
                        `Total Children: ${childrenData.total_children} out of ${childrenData.total_attendees} attendees`;
                    
                    // Update children percentage
                    document.getElementById('childrenPercentage').textContent =
                        `Children Percentage: ${childrenData.children_percentage}%`;
                    
                    // Update attendance breakdown
                    if (childrenData.family_breakdown && childrenData.family_breakdown.length > 0) {
                        const familiesWithChildren = childrenData.family_breakdown.length;
                        document.getElementById('attendanceBreakdown').textContent =
                            `Families with Children: ${familiesWithChildren}`;
                    } else {
                        document.getElementById('attendanceBreakdown').textContent =
                            'No families with children yet';
                    }
                    
                    // Update food preferences (if available)
                    document.getElementById('foodPreferences').textContent =
                        'Food preferences will be shown after RSVP submissions';
                    
                    // Show the statistics section
                    document.getElementById('childrenStats').style.display = 'block';
                    
                } else {
                    // If event-specific stats fail, try system-wide stats
                    const systemResponse = await fetch('/api/analytics/children-stats');
                    
                    if (systemResponse.ok) {
                        const systemData = await systemResponse.json();
                        const childrenData = systemData.children_data;
                        
                        // Update with system-wide data
                        document.getElementById('totalChildrenCount').textContent =
                            `System Total: ${childrenData.total_children} children out of ${childrenData.total_members} members`;
                        
                        document.getElementById('childrenPercentage').textContent =
                            `System Average: ${childrenData.children_percentage}%`;
                        
                        // Update attendance breakdown
                        const attendanceText = Object.entries(childrenData.attendance_breakdown || {})
                            .map(([status, count]) => `${status}: ${count}`)
                            .join(', ');
                        document.getElementById('attendanceBreakdown').textContent =
                            attendanceText || 'No attendance data available';
                        
                        // Update food preferences
                        const foodText = Object.entries(childrenData.food_preferences || {})
                            .map(([food, count]) => `${food}: ${count}`)
                            .join(', ');
                        document.getElementById('foodPreferences').textContent =
                            foodText || 'No food preference data available';
                        
                        // Show the statistics section
                        document.getElementById('childrenStats').style.display = 'block';
                        
                    } else {
                        throw new Error('Failed to load children statistics');
                    }
                }
                
            } catch (error) {
                console.error('Error loading children statistics:', error);
                
                // Show error state
                document.getElementById('totalChildrenCount').textContent = 'Error loading statistics';
                document.getElementById('childrenPercentage').textContent = 'Please try again later';
                document.getElementById('attendanceBreakdown').textContent = 'API connection failed';
                document.getElementById('foodPreferences').textContent = 'Check console for details';
                
                // Still show the section so user can try refresh
                document.getElementById('childrenStats').style.display = 'block';
            }
        }

        // Generate guest detail fields
        function generateGuestFields(count) {
            const container = document.getElementById('guestsContainer');
            container.innerHTML = '';
            guestsData = [];

            for (let i = 0; i < count; i++) {
                const guestDiv = document.createElement('div');
                guestDiv.className = 'guest-entry';
                guestDiv.innerHTML = `
                    <div class="guest-entry-header">Guest ${i + 1}</div>
                    <input type="text" class="form-input" data-guest="${i}" placeholder="Guest name" style="margin-bottom: 12px;" required>
                    <div class="guest-food-options">
                        <div class="guest-food-option" data-guest="${i}" data-food="Vegetarian">
                            <i class="fas fa-leaf"></i>
                            <div>Vegetarian</div>
                        </div>
                        <div class="guest-food-option" data-guest="${i}" data-food="Non-Vegetarian">
                            <i class="fas fa-drumstick-bite"></i>
                            <div>Non-Vegetarian</div>
                        </div>
                    </div>
                    <label class="child-checkbox">
                        <input type="checkbox" data-guest="${i}" class="child-checkbox-input">
                        <span>This is a child</span>
                    </label>
                `;
                container.appendChild(guestDiv);

                // Initialize guest data
                guestsData.push({
                    name: '',
                    food_preference: null,
                    is_child: false
                });
            }

            // Add event listeners for name inputs
            document.querySelectorAll('input[type="text"][data-guest]').forEach(input => {
                input.addEventListener('input', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    guestsData[guestIndex].name = this.value.trim();
                });
            });

            // Add event listeners for food options
            document.querySelectorAll('.guest-food-option').forEach(option => {
                option.addEventListener('click', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    const food = this.dataset.food;
                    
                    // Remove selected class from other options for this guest
                    document.querySelectorAll(`.guest-food-option[data-guest="${guestIndex}"]`).forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // Add selected class to clicked option
                    this.classList.add('selected');
                    
                    // Update guest data
                    guestsData[guestIndex].food_preference = food;
                });
            });

            // Add event listeners for child checkboxes
            document.querySelectorAll('.child-checkbox-input').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    guestsData[guestIndex].is_child = this.checked;
                });
            });
        }

        // Handle form submission
        async function handleSubmit(e) {
            e.preventDefault();

            const eventId = document.getElementById('eventId').value;
            const familyName = document.getElementById('familyName').value.trim();
            const membersCount = document.getElementById('membersCount').value;

            // Validation
            if (!eventId || !familyName || !selectedAttendance) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            if ((selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') && !membersCount) {
                showAlert('Please specify number of guests.', 'error');
                return;
            }

            // Validate guest details
            if ((selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') && parseInt(membersCount) > 0) {
                const allGuestsHaveNames = guestsData.every(guest => guest.name && guest.name.trim() !== '');
                if (!allGuestsHaveNames) {
                    showAlert('Please provide names for all guests.', 'error');
                    return;
                }
                
                const allGuestsHaveFood = guestsData.every(guest => guest.food_preference !== null);
                if (!allGuestsHaveFood) {
                    showAlert('Please select food preference for all guests.', 'error');
                    return;
                }
            }

            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loading = document.getElementById('loading');
            
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            loading.style.display = 'block';

            // Prepare data
            const rsvpData = {
                event_id: parseInt(eventId),
                family_name: familyName,
                attendance: selectedAttendance,
                members_count: (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') ? parseInt(membersCount) : null,
                guests: (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') ? guestsData : []
            };

            try {
                const response = await fetch('/api/rsvp/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(rsvpData)
                });

                if (response.ok) {
                    showAlert('Thank you! Your RSVP has been submitted successfully. 🎉', 'success');
                    document.getElementById('rsvpForm').reset();
                    selectedAttendance = null;
                    guestsData = [];
                    document.querySelectorAll('.attendance-option').forEach(opt => opt.classList.remove('selected'));
                    document.getElementById('membersGroup').style.display = 'none';
                    document.getElementById('guestsDetailsGroup').style.display = 'none';
                    document.getElementById('guestsContainer').innerHTML = '';
                    
                    // Refresh children statistics after successful submission
                    setTimeout(() => {
                        loadChildrenStatistics();
                    }, 1000); // Wait 1 second for database to update
                } else {
                    const errorData = await response.json();
                    showAlert(errorData.detail || 'Failed to submit RSVP. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error submitting RSVP:', error);
                showAlert('Network error. Please check your connection and try again.', 'error');
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                loading.style.display = 'none';
            }
        }

        // Show alert message
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            // Auto hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
            
            // Scroll to alert
            alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
