<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event RSVP - Test Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .event-info {
            background: #f8f9fa;
            padding: 20px 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .event-info h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .info-item i {
            color: #667eea;
            width: 20px;
        }

        .form-section {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .attendance-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .attendance-option {
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .attendance-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .attendance-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .attendance-option i {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        .food-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .food-option {
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .food-option:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .food-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .food-option i {
            font-size: 20px;
            margin-bottom: 8px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading i {
            font-size: 30px;
            color: #667eea;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .guest-entry {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .guest-entry-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .guest-food-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .guest-food-option {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 13px;
        }

        .guest-food-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .guest-food-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .guest-food-option i {
            display: block;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .child-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
        }

        .child-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .attendance-options {
                grid-template-columns: 1fr;
            }

            .guest-food-options {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Event RSVP</h1>
            <p>We would love to have you join us!</p>
        </div>

        <div class="event-info" id="eventInfo" style="display: none;">
            <h2>
                <i class="fas fa-calendar-alt"></i>
                <span id="eventName">Event Details</span>
            </h2>
            <div class="info-item">
                <i class="fas fa-clock"></i>
                <span id="eventDate">Date</span>
            </div>
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <span id="eventLocation">Location</span>
            </div>
        </div>

        <div class="form-section">
            <div class="alert" id="alert"></div>

            <form id="rsvpForm">
                <input type="hidden" id="eventId" value="1" required>

                <div class="form-group">
                    <label class="form-label">Your Family Name *</label>
                    <input type="text" class="form-input" id="familyName" placeholder="Enter your family name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Will you be attending? *</label>
                    <div class="attendance-options">
                        <div class="attendance-option" data-value="Yes">
                            <i class="fas fa-check-circle"></i>
                            <div>Yes, I'll be there!</div>
                        </div>
                        <div class="attendance-option" data-value="Maybe">
                            <i class="fas fa-question-circle"></i>
                            <div>Not sure yet</div>
                        </div>
                    </div>
                </div>

                <div class="form-group" id="membersGroup" style="display: none;">
                    <label class="form-label">Number of Guests *</label>
                    <input type="number" class="form-input" id="membersCount" placeholder="How many people will attend?" min="1" max="20">
                </div>

                <div class="form-group" id="guestsDetailsGroup" style="display: none;">
                    <label class="form-label">Guest Details *</label>
                    <div id="guestsContainer"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="submitText">Submit RSVP</span>
                </button>

                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Submitting your response...</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedAttendance = null;
        let guestsData = [];

        // Load event data on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadEventData();
            setupFormHandlers();
        });

        // Load event data - will be hard coded by user as needed
        function loadEventData() {
            // Try to get event ID from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event_id');
            if (eventId) {
                document.getElementById('eventId').value = eventId;
            }
            // Otherwise, uses the default hardcoded value in the HTML
        }

        // Setup form handlers
        function setupFormHandlers() {
            // Attendance selection
            document.querySelectorAll('.attendance-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.attendance-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedAttendance = this.dataset.value;
                    
                    // Show/hide additional fields based on attendance
                    const membersGroup = document.getElementById('membersGroup');
                    const guestsDetailsGroup = document.getElementById('guestsDetailsGroup');
                    
                    if (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') {
                        membersGroup.style.display = 'block';
                    } else {
                        membersGroup.style.display = 'none';
                        guestsDetailsGroup.style.display = 'none';
                        document.getElementById('membersCount').value = '';
                        guestsData = [];
                    }
                });
            });

            // Members count change handler
            document.getElementById('membersCount').addEventListener('change', function() {
                const count = parseInt(this.value);
                if (count > 0 && count <= 20) {
                    generateGuestFields(count);
                    document.getElementById('guestsDetailsGroup').style.display = 'block';
                } else {
                    document.getElementById('guestsDetailsGroup').style.display = 'none';
                }
            });

            // Form submission
            document.getElementById('rsvpForm').addEventListener('submit', handleSubmit);
        }

        // Generate guest detail fields
        function generateGuestFields(count) {
            const container = document.getElementById('guestsContainer');
            container.innerHTML = '';
            guestsData = [];

            for (let i = 0; i < count; i++) {
                const guestDiv = document.createElement('div');
                guestDiv.className = 'guest-entry';
                guestDiv.innerHTML = `
                    <div class="guest-entry-header">Guest ${i + 1}</div>
                    <input type="text" class="form-input" data-guest="${i}" placeholder="Guest name" style="margin-bottom: 12px;" required>
                    <div class="guest-food-options">
                        <div class="guest-food-option" data-guest="${i}" data-food="Vegetarian">
                            <i class="fas fa-leaf"></i>
                            <div>Vegetarian</div>
                        </div>
                        <div class="guest-food-option" data-guest="${i}" data-food="Non-Vegetarian">
                            <i class="fas fa-drumstick-bite"></i>
                            <div>Non-Vegetarian</div>
                        </div>
                    </div>
                    <label class="child-checkbox">
                        <input type="checkbox" data-guest="${i}" class="child-checkbox-input">
                        <span>This is a child</span>
                    </label>
                `;
                container.appendChild(guestDiv);

                // Initialize guest data
                guestsData.push({
                    name: '',
                    food_preference: null,
                    is_child: false
                });
            }

            // Add event listeners for name inputs
            document.querySelectorAll('input[type="text"][data-guest]').forEach(input => {
                input.addEventListener('input', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    guestsData[guestIndex].name = this.value.trim();
                });
            });

            // Add event listeners for food options
            document.querySelectorAll('.guest-food-option').forEach(option => {
                option.addEventListener('click', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    const food = this.dataset.food;
                    
                    // Remove selected class from other options for this guest
                    document.querySelectorAll(`.guest-food-option[data-guest="${guestIndex}"]`).forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    
                    // Add selected class to clicked option
                    this.classList.add('selected');
                    
                    // Update guest data
                    guestsData[guestIndex].food_preference = food;
                });
            });

            // Add event listeners for child checkboxes
            document.querySelectorAll('.child-checkbox-input').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const guestIndex = parseInt(this.dataset.guest);
                    guestsData[guestIndex].is_child = this.checked;
                });
            });
        }

        // Handle form submission
        async function handleSubmit(e) {
            e.preventDefault();

            const eventId = document.getElementById('eventId').value;
            const familyName = document.getElementById('familyName').value.trim();
            const membersCount = document.getElementById('membersCount').value;

            // Validation
            if (!eventId || !familyName || !selectedAttendance) {
                showAlert('Please fill in all required fields.', 'error');
                return;
            }

            if ((selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') && !membersCount) {
                showAlert('Please specify number of guests.', 'error');
                return;
            }

            // Validate guest details
            if ((selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') && parseInt(membersCount) > 0) {
                const allGuestsHaveNames = guestsData.every(guest => guest.name && guest.name.trim() !== '');
                if (!allGuestsHaveNames) {
                    showAlert('Please provide names for all guests.', 'error');
                    return;
                }
                
                const allGuestsHaveFood = guestsData.every(guest => guest.food_preference !== null);
                if (!allGuestsHaveFood) {
                    showAlert('Please select food preference for all guests.', 'error');
                    return;
                }
            }

            // Show loading state
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loading = document.getElementById('loading');
            
            submitBtn.disabled = true;
            submitText.style.display = 'none';
            loading.style.display = 'block';

            // Prepare data
            const rsvpData = {
                event_id: parseInt(eventId),
                family_name: familyName,
                attendance: selectedAttendance,
                members_count: (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') ? parseInt(membersCount) : null,
                guests: (selectedAttendance === 'Yes' || selectedAttendance === 'Maybe') ? guestsData : []
            };

            try {
                const response = await fetch('/api/rsvp/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(rsvpData)
                });

                if (response.ok) {
                    showAlert('Thank you! Your RSVP has been submitted successfully. 🎉', 'success');
                    document.getElementById('rsvpForm').reset();
                    selectedAttendance = null;
                    guestsData = [];
                    document.querySelectorAll('.attendance-option').forEach(opt => opt.classList.remove('selected'));
                    document.getElementById('membersGroup').style.display = 'none';
                    document.getElementById('guestsDetailsGroup').style.display = 'none';
                    document.getElementById('guestsContainer').innerHTML = '';
                } else {
                    const errorData = await response.json();
                    showAlert(errorData.detail || 'Failed to submit RSVP. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Error submitting RSVP:', error);
                showAlert('Network error. Please check your connection and try again.', 'error');
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                loading.style.display = 'none';
            }
        }

        // Show alert message
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            
            // Auto hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
            
            // Scroll to alert
            alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
