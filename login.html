<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WedCraft – Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('assets/images/background.png') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .container {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-top: 120px;
            position: relative;
            z-index: 2;
        }

        .form-wrapper {
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
            animation: fadeIn 0.9s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 28px;
            letter-spacing: 1px;
        }


        .input-group {
            margin-bottom: 20px;
        }

        label {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            transition: 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4e8a, #ff6fa4);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 78, 138, 0.45);
            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #e63d78, #ff4e8a);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 78, 138, 0.6);
        }

        .success-message {
            background: rgba(0, 255, 127, 0.2);
            border: 1px solid rgba(0, 255, 127, 0.5);
            color: #00FF7F;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #FF6B6B;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }


        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                margin-top: 140px;
            }
            
            .form-wrapper {
                padding: 30px 25px;
            }

            .admin-controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <nav style="position: fixed; top: 0; left: 0; width: 100%; padding: 22px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.10); z-index: 100; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; line-height: 1.1;">
            <h1 style="color: #fff; font-size: 26px; margin: 0; font-weight: 600;">WedCraft</h1>
            <span style="color: #fff; font-size: 13px; opacity: 0.85;">Wedding website builder</span>
        </div>
        <div style="display: flex; gap: 26px; align-items: center;">
            <a href="welcome.html#features" style="color: #fff; text-decoration: none; font-size: 15px;">Features</a>
            <a href="welcome.html#how" style="color: #fff; text-decoration: none; font-size: 15px;">How it works</a>
            <a href="welcome.html#pricing" style="color: #fff; text-decoration: none; font-size: 15px;">Pricing</a>
            <a href="welcome.html#contact" style="color: #fff; text-decoration: none; font-size: 15px;">Contact</a>
            <a href="dashboard.html" style="padding: 10px 18px; background: rgba(255,255,255,0.22); color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px;">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <h2>🔐 Login to WedCraft</h2>
            
            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Unified Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

        </div>
    </div>

    <script>
        // Clear all messages
        function clearMessages() {
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const userSuccessMessage = document.getElementById('userSuccessMessage');
            const userErrorMessage = document.getElementById('userErrorMessage');
            
            if (successMessage) successMessage.style.display = 'none';
            if (errorMessage) errorMessage.style.display = 'none';
            if (userSuccessMessage) userSuccessMessage.style.display = 'none';
            if (userErrorMessage) userErrorMessage.style.display = 'none';
        }

        // Unified Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            clearMessages();
            
            try {
                // Use the unified login endpoint
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const userType = result.user.user_type;
                    const userName = result.user.name;
                    
                    document.getElementById('successMessage').textContent =
                        `Welcome ${userName}! Redirecting to ${userType} dashboard...`;
                    document.getElementById('successMessage').style.display = 'block';
                    
                    // Store session data based on user type
                    if (userType === 'admin') {
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        sessionStorage.setItem('adminData', JSON.stringify(result.user));
                        sessionStorage.setItem('adminEmail', email);
                        sessionStorage.setItem('userType', 'admin');
                    } else {
                        sessionStorage.setItem('userLoggedIn', 'true');
                        sessionStorage.setItem('userData', JSON.stringify(result.user));
                        sessionStorage.setItem('userType', 'user');
                    }
                    
                    // Store common session data
                    sessionStorage.setItem('accessToken', result.access_token);
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = result.redirect_to + '.html';
                    }, 1500);
                } else {
                    document.getElementById('errorMessage').textContent = result.detail || 'Invalid credentials. Please try again.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('errorMessage').textContent = 'Login failed. Please try again.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        // Logout function
        function logout() {
            // Clear all session storage
            sessionStorage.clear();
            
            // Clear all forms and messages
            document.getElementById('loginForm').reset();
            clearMessages();
            
            // Show success message
            document.getElementById('successMessage').textContent = 'Logged out successfully!';
            document.getElementById('successMessage').style.display = 'block';
            
            // Hide success message after 2 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 2000);
        }

        // Check if user is already logged in and redirect to dashboard
        if (sessionStorage.getItem('adminLoggedIn') || sessionStorage.getItem('userLoggedIn') || sessionStorage.getItem('currentUser')) {
            // Add a small delay to prevent flickering and redirect to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 100);
        }
    </script>
</body>
</html>
