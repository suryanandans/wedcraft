<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WedCraft – Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('assets/images/registration-bg.png') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .container {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-top: 120px;
        }

        .form-wrapper {
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
            animation: fadeIn 0.9s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .login-tabs {
            display: flex;
            margin-bottom: 30px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: 600;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            transition: 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4e8a, #ff6fa4);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 78, 138, 0.45);
            transition: 0.3s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #e63d78, #ff4e8a);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 78, 138, 0.6);
        }

        .success-message {
            background: rgba(0, 255, 127, 0.2);
            border: 1px solid rgba(0, 255, 127, 0.5);
            color: #00FF7F;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #FF6B6B;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .user-creation-section {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .section-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .admin-controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                margin-top: 140px;
            }
            
            .form-wrapper {
                padding: 30px 25px;
            }

            .admin-controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <nav style="position: fixed; top: 0; left: 0; width: 100%; padding: 22px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.10); z-index: 10; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; line-height: 1.1;">
            <h1 style="color: #fff; font-size: 26px; margin: 0; font-weight: 600;">WedCraft</h1>
            <span style="color: #fff; font-size: 13px; opacity: 0.85;">Wedding website builder</span>
        </div>
        <div style="display: flex; gap: 26px; align-items: center;">
            <a href="welcome.html#features" style="color: #fff; text-decoration: none; font-size: 15px;">Features</a>
            <a href="welcome.html#how" style="color: #fff; text-decoration: none; font-size: 15px;">How it works</a>
            <a href="welcome.html#pricing" style="color: #fff; text-decoration: none; font-size: 15px;">Pricing</a>
            <a href="welcome.html#contact" style="color: #fff; text-decoration: none; font-size: 15px;">Contact</a>
            <a href="dashboard.html" style="padding: 10px 18px; background: rgba(255,255,255,0.22); color: #fff; border-radius: 8px; text-decoration: none; font-size: 14px;">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <h2>🔐 Login to WedCraft</h2>
            
            <!-- Login Type Tabs -->
            <div class="login-tabs">
                <button class="tab-button active" id="userTab" onclick="switchTab('user')">User Login</button>
                <button class="tab-button" id="adminTab" onclick="switchTab('admin')">Admin Login</button>
            </div>
            
            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label id="emailLabel">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label id="passwordLabel">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="login-btn" id="loginBtn">Login</button>
            </form>

            <!-- Admin User Creation Section (Hidden initially) -->
            <div class="user-creation-section" id="userCreationSection">
                <div class="section-title">👥 Create New User</div>
                
                <div class="success-message" id="userSuccessMessage"></div>
                <div class="error-message" id="userErrorMessage"></div>
                
                <form id="createUserForm">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="userName" placeholder="Enter user's full name" required />
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="userEmail" placeholder="Enter user's email" required />
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="userPassword" placeholder="Create password for user" required />
                    </div>

                    <div class="input-group">
                        <label>User Role</label>
                        <select id="userRole" required>
                            <option value="">Select user role</option>
                            <option value="user">User</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Wedding Date (Optional)</label>
                        <input type="date" id="weddingDate" />
                    </div>

                    <button type="submit" class="login-btn">Create User Account</button>
                </form>

                <div class="admin-controls">
                    <a href="dashboard.html" class="control-btn">📊 Dashboard</a>
                    <button class="control-btn" onclick="logout()">🚪 Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLoginType = 'user';

        // Switch between user and admin login tabs
        function switchTab(type) {
            currentLoginType = type;
            
            // Update tab appearance
            document.getElementById('userTab').classList.toggle('active', type === 'user');
            document.getElementById('adminTab').classList.toggle('active', type === 'admin');
            
            // Update form labels and placeholders
            if (type === 'admin') {
                document.getElementById('emailLabel').textContent = 'Admin Email';
                document.getElementById('passwordLabel').textContent = 'Admin Password';
                document.getElementById('email').placeholder = 'Enter admin email';
                document.getElementById('password').placeholder = 'Enter admin password';
                document.getElementById('loginBtn').textContent = 'Login as Admin';
            } else {
                document.getElementById('emailLabel').textContent = 'Email';
                document.getElementById('passwordLabel').textContent = 'Password';
                document.getElementById('email').placeholder = 'Enter your email';
                document.getElementById('password').placeholder = 'Enter your password';
                document.getElementById('loginBtn').textContent = 'Login';
            }
            
            // Clear messages and form
            clearMessages();
            document.getElementById('loginForm').reset();
        }

        // Clear all messages
        function clearMessages() {
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('userSuccessMessage').style.display = 'none';
            document.getElementById('userErrorMessage').style.display = 'none';
        }

        // Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            clearMessages();
            
            try {
                let endpoint = currentLoginType === 'admin' ? '/api/admin/login' : '/api/user/login';
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    if (currentLoginType === 'admin') {
                        document.getElementById('successMessage').textContent = 'Admin login successful! Redirecting to dashboard...';
                        document.getElementById('successMessage').style.display = 'block';
                        
                        // Store admin session data for dashboard
                        localStorage.setItem('adminLoggedIn', 'true');
                        localStorage.setItem('adminData', JSON.stringify(result.admin));
                        localStorage.setItem('adminEmail', email);
                        localStorage.setItem('userType', 'admin');
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 2000);
                    } else {
                        document.getElementById('successMessage').textContent = 'Login successful! Redirecting to dashboard...';
                        document.getElementById('successMessage').style.display = 'block';
                        
                        // Store user session
                        localStorage.setItem('userLoggedIn', 'true');
                        localStorage.setItem('userData', JSON.stringify(result.user));
                        localStorage.setItem('userType', 'user');
                        
                        // All users redirect to dashboard.html
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 2000);
                    }
                } else {
                    document.getElementById('errorMessage').textContent = result.detail || 'Invalid credentials. Please try again.';
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('errorMessage').textContent = 'Login failed. Please try again.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });

        // Create User Form Handler
        document.getElementById('createUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Check if admin is logged in
            if (!localStorage.getItem('adminLoggedIn')) {
                document.getElementById('userErrorMessage').textContent = 'Please login as admin first to create users.';
                document.getElementById('userErrorMessage').style.display = 'block';
                return;
            }
            
            const userData = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                password: document.getElementById('userPassword').value,
                role: document.getElementById('userRole').value,
                weddingDate: document.getElementById('weddingDate').value || null
            };
            
            // Clear previous messages
            document.getElementById('userSuccessMessage').style.display = 'none';
            document.getElementById('userErrorMessage').style.display = 'none';
            
            try {
                const response = await fetch('/api/admin/create-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('userSuccessMessage').textContent = `User account created successfully for ${userData.name}!`;
                    document.getElementById('userSuccessMessage').style.display = 'block';
                    
                    // Reset form
                    document.getElementById('createUserForm').reset();
                } else {
                    document.getElementById('userErrorMessage').textContent = result.detail || 'Failed to create user account. Please try again.';
                    document.getElementById('userErrorMessage').style.display = 'block';
                }
                
            } catch (error) {
                console.error('User creation error:', error);
                document.getElementById('userErrorMessage').textContent = 'Failed to create user account. Please try again.';
                document.getElementById('userErrorMessage').style.display = 'block';
            }
        });

        // Logout function
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminEmail');
            localStorage.removeItem('userLoggedIn');
            localStorage.removeItem('userData');
            
            // Hide user creation section
            document.getElementById('userCreationSection').style.display = 'none';
            
            // Reset to user login tab
            switchTab('user');
            
            // Clear all forms and messages
            document.getElementById('loginForm').reset();
            document.getElementById('createUserForm').reset();
            clearMessages();
        }

        // Check if user is already logged in
        if (localStorage.getItem('adminLoggedIn') || localStorage.getItem('userLoggedIn')) {
            // Add a small delay to prevent flickering and redirect to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 100);
        }
    </script>
</body>
</html>
