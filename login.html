<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WedCraft – Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: url('assets/images/background.png') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .container {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            margin-top: 120px;
            position: relative;
            z-index: 2;
        }

        .form-wrapper {
            width: 100%;
            padding: 40px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.35);
            animation: fadeIn 0.9s ease;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 28px;
            letter-spacing: 1px;
        }


        .input-group {
            margin-bottom: 20px;
        }

        label {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.55);
            font-size: 15px;
            transition: 0.3s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
            box-sizing: border-box;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4e8a, #ff6fa4);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 78, 138, 0.45);
            transition: 0.3s ease;
        }

        .login-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #e63d78, #ff4e8a);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 78, 138, 0.6);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            background: rgba(0, 255, 127, 0.2);
            border: 1px solid rgba(0, 255, 127, 0.5);
            color: #00FF7F;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #FF6B6B;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            font-weight: 500;
        }


        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-text {
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            font-style: italic;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .typing-text span {
            opacity: 0;
        }

        /* Enhanced Responsive Design */
        
        /* Tablet View (768px - 1024px) */
        @media (max-width: 1024px) and (min-width: 769px) {
            .container {
                width: 85%;
                max-width: 450px;
                margin-top: 100px;
            }
            
            .form-wrapper {
                padding: 35px;
            }
            
            nav {
                padding: 18px 30px;
            }
            
            nav h1 {
                font-size: 24px;
            }
            
            nav span {
                font-size: 12px;
            }
            
            .typing-text {
                font-size: 18px;
            }
        }

        /* Mobile View (max-width: 768px) */
        @media (max-width: 768px) {
            body {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            
            nav {
                position: fixed;
                padding: 15px 20px;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 10px;
            }
            
            nav h1 {
                font-size: 22px;
                margin: 0;
            }
            
            nav span {
                font-size: 11px;
            }
            
            .typing-text {
                font-size: 16px;
                white-space: normal;
                text-align: center;
                line-height: 1.3;
            }

            .container {
                width: 95%;
                max-width: none;
                margin: 120px auto 20px;
                flex: 1;
                display: flex;
                align-items: center;
            }
            
            .form-wrapper {
                padding: 25px 20px;
                width: 100%;
            }
            
            h2 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            
            .input-group {
                margin-bottom: 18px;
            }
            
            label {
                font-size: 13px;
                margin-bottom: 6px;
            }
            
            input, select {
                padding: 14px;
                font-size: 16px; /* Prevents zoom on iOS */
                border-radius: 10px;
            }
            
            .login-btn {
                padding: 14px;
                font-size: 16px;
                border-radius: 10px;
                margin-top: 15px;
            }
            
            .success-message,
            .error-message {
                padding: 12px;
                font-size: 14px;
                border-radius: 8px;
                margin-bottom: 15px;
            }
        }

        /* Small Mobile View (max-width: 480px) */
        @media (max-width: 480px) {
            nav {
                padding: 12px 15px;
            }
            
            nav h1 {
                font-size: 20px;
            }
            
            nav span {
                font-size: 10px;
            }
            
            .typing-text {
                font-size: 14px;
            }
            
            .container {
                width: 98%;
                margin: 110px auto 15px;
            }
            
            .form-wrapper {
                padding: 20px 15px;
                border-radius: 18px;
            }
            
            h2 {
                font-size: 22px;
                margin-bottom: 20px;
            }
            
            input, select {
                padding: 12px;
                font-size: 16px;
                border-radius: 8px;
            }
            
            .login-btn {
                padding: 12px;
                font-size: 15px;
                border-radius: 8px;
            }
        }

        /* Landscape Mobile View */
        @media (max-width: 768px) and (orientation: landscape) {
            nav {
                position: relative;
                padding: 10px 20px;
                flex-direction: row;
                justify-content: space-between;
            }
            
            nav h1 {
                font-size: 20px;
            }
            
            nav span {
                font-size: 10px;
            }
            
            .typing-text {
                font-size: 14px;
            }
            
            .container {
                margin: 20px auto;
                max-width: 500px;
            }
            
            .form-wrapper {
                padding: 20px;
            }
            
            h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }
            
            .input-group {
                margin-bottom: 15px;
            }
            
            input, select {
                padding: 10px;
            }
            
            .login-btn {
                padding: 10px;
                margin-top: 10px;
            }
        }

        /* Touch device optimizations */
        @media (hover: none) and (pointer: coarse) {
            .login-btn:hover:not(:disabled) {
                transform: none;
                box-shadow: 0 5px 20px rgba(255, 78, 138, 0.45);
            }
            
            input:focus, select:focus {
                transform: none;
            }
            
            /* Larger touch targets */
            .login-btn {
                min-height: 44px;
            }
            
            input, select {
                min-height: 44px;
            }
        }

        /* High DPI / Retina Display Support */
        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            body::before {
                background-size: cover;
            }
        }

        /* Accessibility improvements for small screens */
        @media (max-width: 480px) {
            .spinner {
                width: 16px;
                height: 16px;
                border-width: 2px;
            }
        }
    </style>
</head>
<body>
    <nav style="position: fixed; top: 0; left: 0; width: 100%; padding: 22px 40px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.10); z-index: 100; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; line-height: 1.1;">
            <h1 style="color: #fff; font-size: 26px; margin: 0; font-weight: 600;">Event Manager</h1>
            <span style="color: #fff; font-size: 13px; opacity: 0.85;">Wedding website builder</span>
        </div>
        <div class="typing-text" id="typingText"></div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <h2>🔐 Login to WedCraft</h2>
            
            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Unified Login Form -->
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginBtnText">Login</span>
                </button>
            </form>

        </div>
    </div>

    <script>
        // Typing animation for navigation text with infinite loop
        function typeText() {
            const text = "Plan - Execute - Celebrate";
            const typingElement = document.getElementById('typingText');
            const charDelay = 100; // milliseconds between each character
            const pauseBeforeReset = 2000; // pause after full text appears
            const fadeOutDuration = 500; // fade out duration
            
            let currentIndex = 0;
            let spans = [];
            
            // Create spans for each character
            text.split('').forEach((char) => {
                const span = document.createElement('span');
                span.textContent = char;
                span.style.opacity = '0';
                span.style.transition = 'opacity 0.1s';
                typingElement.appendChild(span);
                spans.push(span);
            });
            
            function showNextChar() {
                if (currentIndex < spans.length) {
                    spans[currentIndex].style.opacity = '1';
                    currentIndex++;
                    setTimeout(showNextChar, charDelay);
                } else {
                    // All characters shown, wait then reset
                    setTimeout(resetAnimation, pauseBeforeReset);
                }
            }
            
            function resetAnimation() {
                // Fade out all characters
                spans.forEach(span => {
                    span.style.transition = `opacity ${fadeOutDuration}ms`;
                    span.style.opacity = '0';
                });
                
                // Reset and start again
                setTimeout(() => {
                    currentIndex = 0;
                    showNextChar();
                }, fadeOutDuration);
            }
            
            // Start the animation
            showNextChar();
        }

        // Initialize typing animation on page load
        window.addEventListener('DOMContentLoaded', typeText);

        // Clear all messages
        function clearMessages() {
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const userSuccessMessage = document.getElementById('userSuccessMessage');
            const userErrorMessage = document.getElementById('userErrorMessage');
            
            if (successMessage) successMessage.style.display = 'none';
            if (errorMessage) errorMessage.style.display = 'none';
            if (userSuccessMessage) userSuccessMessage.style.display = 'none';
            if (userErrorMessage) userErrorMessage.style.display = 'none';
        }

        // Unified Login Form Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            
            clearMessages();
            
            // Show spinner and disable button
            loginBtn.disabled = true;
            loginBtnText.innerHTML = '<span class="spinner"></span>Logging in...';
            
            try {
                // Use the unified login endpoint
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const userType = result.user.user_type;
                    const userName = result.user.name;
                    
                    // Store session data based on user type
                    if (userType === 'admin') {
                        sessionStorage.setItem('adminLoggedIn', 'true');
                        sessionStorage.setItem('adminData', JSON.stringify(result.user));
                        sessionStorage.setItem('adminEmail', email);
                        sessionStorage.setItem('userType', 'admin');
                    } else {
                        sessionStorage.setItem('userLoggedIn', 'true');
                        sessionStorage.setItem('userData', JSON.stringify(result.user));
                        sessionStorage.setItem('userType', 'user');
                    }
                    
                    // Store common session data
                    sessionStorage.setItem('accessToken', result.access_token);
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    
                    // Redirect to dashboard after a short delay
                    setTimeout(() => {
                        window.location.href = result.redirect_to + '.html';
                    }, 1500);
                } else {
                    document.getElementById('errorMessage').textContent = result.detail || 'Invalid credentials. Please try again.';
                    document.getElementById('errorMessage').style.display = 'block';
                    
                    // Re-enable button and restore text
                    loginBtn.disabled = false;
                    loginBtnText.innerHTML = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('errorMessage').textContent = 'Login failed. Please try again.';
                document.getElementById('errorMessage').style.display = 'block';
                
                // Re-enable button and restore text
                loginBtn.disabled = false;
                loginBtnText.innerHTML = 'Login';
            }
        });

        // Logout function
        function logout() {
            // Clear all session storage
            sessionStorage.clear();
            
            // Clear all forms and messages
            document.getElementById('loginForm').reset();
            clearMessages();
            
            // Show success message
            document.getElementById('successMessage').textContent = 'Logged out successfully!';
            document.getElementById('successMessage').style.display = 'block';
            
            // Hide success message after 2 seconds
            setTimeout(() => {
                document.getElementById('successMessage').style.display = 'none';
            }, 2000);
        }

        // Check if user is already logged in and redirect to dashboard
        if (sessionStorage.getItem('adminLoggedIn') || sessionStorage.getItem('userLoggedIn') || sessionStorage.getItem('currentUser')) {
            // Add a small delay to prevent flickering and redirect to dashboard
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 100);
        }
    </script>
</body>
</html>
